[project]
name = "job-application-copilot-api"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the Job Application Copilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sse-starlette",
  "pydantic>=2",
  "pydantic-settings",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "langchain-core",
  "langchain-google-genai",
  "psycopg[binary]",
  "pgvector",
  "sqlalchemy>=2",
  "langfuse",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
