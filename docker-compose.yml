services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5435:5432"  # 5435 so it can run next to other local Postgres containers
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
